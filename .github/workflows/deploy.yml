# Deploys the campaign to Cloudflare Workers whenever main changes.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Cloudflare → My Profile →
# API Tokens → "Edit Cloudflare Workers" template). The account comes from
# `account_id` in wrangler.jsonc. Worker secrets (Supabase, Turnstile) stay in
# Cloudflare and are not touched by this workflow.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the Cloudflare token is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set. See README → Auto-deploy."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
